<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
    <link rel="stylesheet" href="./styles/main.css" />
    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main>
      <section class="card">
        <img
          class="card__image"
          src="./assets/images/illustration-article.svg"
          alt=""
          width=""
          height=""
        />
        <div class="card__body">
          <div class="card__category">Learning</div>
          <div class="card__published-date">
            Published <time datetime="21-12-2023">21 Dec 2023</time>
          </div>
          <h1 class="card__title">HTML & CSS foundations</h1>
          <p class="card__description">
            These languages are the backbone of every website, defining structure, content, and
            presentation.
          </p>
        </div>
        <article class="card__author">
          <img
            class="card__author-image"
            src="./assets/images/image-avatar.webp"
            alt=""
            width=""
            height=""
          />
          <b class="card__author-name">Greg Hooper</b>
        </article>
      </section>
    </main>
  </body>
</html>
