<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
    <link rel="stylesheet" href="./styles/main.css" />
    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main>
      <article class="card">
        <img
          class="card__image"
          src="./assets/images/illustration-article.svg"
          alt=""
          width="336"
          height="200"
        />
        <div class="card__body">
          <div class="card__category">Learning</div>
          <div class="card__published-date">
            Published <time datetime="2023-12-21">21 Dec 2023</time>
          </div>
          <h1 class="card__title">
            <a href="/">HTML & CSS foundations</a>
          </h1>
          <p class="card__description">
            These languages are the backbone of every website, defining structure, content, and
            presentation.
          </p>
        </div>
        <div class="card__author">
          <img
            class="card__author-image"
            src="./assets/images/image-avatar.webp"
            alt="Greg Hooper avatar"
            width="32"
            height="32"
          />
          <b class="card__author-name">Greg Hooper</b>
        </div>
      </article>
    </main>
  </body>
</html>
